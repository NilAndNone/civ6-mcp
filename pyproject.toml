[project]
name = "codex-hl-civ6"
version = "0.0.2"
description = "Codex HL Civ6 plugin for observation-first Civ6 play, offline failure review, strategy asset governance, candidate strategy improvements, validation scenarios, guarded merges, and multi-T50 self-evolution orchestration"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Xiaohan Lu" }
]
requires-python = ">=3.12"
keywords = ["codex", "civ6", "civilization", "strategy", "governance", "assets", "observation", "review", "validation", "evolution", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
    "fastapi[standard]>=0.128",
    "anthropic>=0.84.0",
]

[project.optional-dependencies]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
    "Pillow>=10.0",
    "pywin32>=306",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
launcher = ["codex-hl-civ6[launcher-macos]"]

[project.scripts]
codex-hl-civ6-observe = "codex_hl.evidence.observation:main"
codex-hl-civ6-review = "codex_hl.review.failure_labeling:main"
codex-hl-civ6-strategy-assets = "codex_hl.strategy.registry:main"
codex-hl-civ6-strategy-candidates = "codex_hl.strategy.candidates:main"
codex-hl-civ6-validation-scenarios = "codex_hl.validation.scenarios:main"
codex-hl-civ6-governance = "codex_hl.governance.gates:main"
codex-hl-civ6-runs = "codex_hl.runs.orchestrator:main"
codex-hl-civ6-acceptance = "codex_hl.reports.acceptance:main"
codex-hl-civ6-live-eval = "codex_hl.live.evaluation:main"
codex-hl-civ6-live-t50-driver = "codex_hl.live.t50_driver:main"
codex-hl-civ6-debug = "codex_hl.diagnostics.connector:main"
codex-hl-civ6-load-test1 = "codex_hl.diagnostics.load_test1:main"
codex-hl-civ6-human-demo-record = "codex_hl.demos.cli:main"
civ6-connector = "civ6_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["plugin/src/codex_hl", "plugin/src/civ6_connector"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/assets" = "assets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
