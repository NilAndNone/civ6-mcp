[project]
name = "codex-hl-civ6"
version = "0.1.0"
description = "Codex HL Civ6 plugin for Phase 0/1 observation-first play"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Xiaohan Lu" }
]
requires-python = ">=3.12"
keywords = ["codex", "civ6", "civilization", "phase1", "observation", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
    "fastapi[standard]>=0.128",
    "anthropic>=0.84.0",
]

[project.optional-dependencies]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
launcher = ["codex-hl-civ6[launcher-macos]"]

[project.scripts]
codex-hl-civ6-phase1-observe = "codex_hl.phase1.observer:main"
codex-hl-civ6-debug = "codex_hl.debug:main"
civ6-connector = "civ6_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["plugin/src/codex_hl", "plugin/src/civ6_connector"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
