[project]
name = "codex-hl-civ6"
version = "0.0.1"
description = "Codex HL Civ6 plugin for observation-first Civ6 play, offline failure labeling, asset registry validation, candidate improvements, scenario pools, guarded asset governance, and multi-T50 evolution orchestration"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Xiaohan Lu" }
]
requires-python = ">=3.12"
keywords = ["codex", "civ6", "civilization", "phase1", "phase2", "phase3", "phase4", "phase5", "governance", "assets", "observation", "evolution", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20",
    "fastapi[standard]>=0.128",
    "anthropic>=0.84.0",
]

[project.optional-dependencies]
launcher-macos = [
    "pyobjc-framework-Quartz>=11.0",
    "pyobjc-framework-Vision>=11.0",
]
launcher-windows = [
    "winrt-Windows.Media.Ocr>=2.1",
    "winrt-Windows.Graphics.Imaging>=2.1",
    "winrt-Windows.Storage.Streams>=2.1",
    "winrt-Windows.Foundation>=2.1",
    "winrt-Windows.Foundation.Collections>=2.1",
]
launcher-linux = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
launcher = ["codex-hl-civ6[launcher-macos]"]

[project.scripts]
codex-hl-civ6-phase1-observe = "codex_hl.phase1.observer:main"
codex-hl-civ6-phase2-label = "codex_hl.phase2.labeler:main"
codex-hl-civ6-phase3-assets = "codex_hl.phase3.assets:main"
codex-hl-civ6-phase4-candidates = "codex_hl.phase4.improvements:main"
codex-hl-civ6-phase5-scenarios = "codex_hl.phase5.scenarios:main"
codex-hl-civ6-governance = "codex_hl.governance.automation:main"
codex-hl-civ6-evolve = "codex_hl.evolution.orchestrator:main"
codex-hl-civ6-debug = "codex_hl.debug:main"
civ6-connector = "civ6_connector.server:main"

[tool.hatch.build.targets.wheel]
packages = ["plugin/src/codex_hl", "plugin/src/civ6_connector"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/assets" = "assets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
